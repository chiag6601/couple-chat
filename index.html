<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06c755">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Our Space — 情人聊天室</title>
<style>
:root{
  --bg:#e9ebee; --panel:#ffffff; --panel2:#f2f3f5; --line:#e2e4e8;
  --text:#1a1a1a; --sub:#8a8f99; --accent:#06c755; --accent2:#00b8d4;
  --ok:#22c55e; --err:#fa5151; --bubble1:#ffffff; --bubble2:#a8ff60;
  --header:#ffffff; --chatbg:#8fce8f;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft JhengHei',system-ui,-apple-system,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text)}
#app{max-width:720px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.15)}
@media(max-width:600px){
  #app{max-width:100%;box-shadow:none}
  .m{max-width:82%}
  header{padding:10px 12px}
  header .who{font-size:14px}
  .composer{padding:8px}
  #localPreview{width:90px;height:120px;bottom:110px}
  #settings .card{max-width:100%}
  .callbtns{gap:14px}
}

/* login */
.screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.screen.active{display:flex}
.logo{font-size:44px;margin-bottom:8px}
.screen h1{font-size:22px;margin-bottom:4px}
.screen p{color:var(--sub);font-size:13px;margin-bottom:24px}
.card{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;margin-bottom:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:400}
.hint{color:var(--sub);font-size:12px;margin-top:12px;text-align:center}
.msg{font-size:12px;margin-top:10px;min-height:16px;text-align:center}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}

/* chat */
#chat{display:none;flex-direction:column;height:100vh}
#chat.active{display:flex}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--header);border-bottom:1px solid var(--line)}
header .who{font-weight:700;font-size:16px}
header .who small{display:block;color:var(--sub);font-weight:400;font-size:11px}
header .acts{display:flex;gap:8px}
.act{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:13px;cursor:pointer}
.act.call{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.messages{flex:1;overflow-y:auto;padding:18px;background:var(--chatbg);display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:8px;max-width:75%;align-items:flex-end}
.m .av{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(135deg,#00b8d4,#06c755);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.m .col{flex:1}
.m .meta{font-size:11px;color:#5a6068;margin-bottom:3px;font-weight:600}
.m .bub{background:var(--bubble1);padding:10px 14px;border-radius:4px 16px 16px 16px;font-size:14px;line-height:1.45;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.me .bub{background:var(--bubble2);color:#111;border-radius:16px 4px 16px 16px}
.m.me .av{background:linear-gradient(135deg,#ffd54f,#ff9800)}
.m img{max-width:230px;max-height:230px;border-radius:12px;display:block}
.m .bub.stickerimg{background:transparent!important;box-shadow:none;padding:2px}
.m .bub.stickerimg img{max-width:150px;max-height:150px;border-radius:14px}
.m .time{font-size:10px;color:#4a5058;margin-top:4px}
.m.me .time{text-align:right}
.composer{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);position:relative;align-items:center}
.composer input[type=text]{flex:1;margin:0;background:var(--panel2);padding:11px 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;color:var(--text)}
.send,.sticker{width:42px;height:42px;flex:none;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.sticker{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.send{background:var(--accent);color:#fff}
.sticker-pad{position:absolute;bottom:60px;right:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:none;gap:8px;flex-wrap:wrap;width:240px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:260px;overflow-y:auto}
.sticker-pad.open{display:flex}
.sticker-pad .st{font-size:30px;cursor:pointer;padding:2px;border-radius:8px;transition:transform .1s}
.sticker-pad .st:hover{transform:scale(1.2);background:var(--panel2)}
.sticker-pad .stwrap{position:relative;width:56px;height:56px}
.sticker-pad .stwrap img{width:56px;height:56px;object-fit:contain;cursor:pointer;border-radius:8px}
.sticker-pad .stwrap img:hover{background:var(--panel2)}
.sticker-pad .stwrap .del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#e74c3c;color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sticker-pad .addst{width:56px;height:56px;border-radius:8px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;color:var(--sub)}

/* call overlay */
#call{position:fixed;inset:0;background:rgba(15,17,23,.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:24px}
#call.active{display:flex}
#call .peer{width:280px;height:280px;border-radius:20px;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
#call .peer video{width:100%;height:100%;object-fit:cover}
#call .peer .initials{font-size:64px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent));width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#call .cname{font-size:18px;font-weight:600;margin-bottom:4px}
#call .cstatus{color:var(--sub);font-size:13px;margin-bottom:28px}
.callbtns{display:flex;gap:16px}
.cb{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
.cb.mic{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.cb.mic.off{color:var(--err)}
.cb.vid{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.cb.vid.off{color:var(--err)}
.cb.end{background:var(--err);color:#fff}
.cb.ok{background:#22c55e;color:#fff}
.cb.min{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
#localPreview{position:absolute;right:20px;bottom:120px;width:120px;height:160px;border-radius:12px;overflow:hidden;border:2px solid #fff;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:5}
#localPreview.on{display:block}
#localPreview video{width:100%;height:100%;object-fit:cover}
#callPill{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;cursor:pointer;z-index:45;display:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#callPill.active{display:block}
#incomingCall{position:fixed;inset:0;background:rgba(15,17,23,.9);display:none;align-items:center;justify-content:center;z-index:60}
#incomingCall.active{display:flex}
#incomingCall .inc-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:10px}
#incomingCall .inc-av{font-size:56px;animation:ring 1s infinite}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#incomingCall .inc-title{font-size:20px;font-weight:700}
#incomingCall .inc-sub{color:var(--sub);font-size:13px;margin-bottom:14px}

/* settings modal */
#settings{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#settings.active{display:flex}
#settings .card{max-width:360px;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#settings .row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#settings .row label{flex:1;font-size:13px;color:var(--sub)}
#settings .row input{flex:2;margin:0}
.spin{border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;width:22px;height:22px;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">

<!-- ============ LOGIN ============ -->
<div id="login" class="screen active">
  <div class="logo">💞</div>
  <h1>Our Space</h1>
  <p>你的專屬空間</p>
  <div class="card">
    <input type="text" id="email" placeholder="帳號(如 chiag455371)" autocomplete="username">
    <input type="password" id="password" placeholder="密碼" autocomplete="current-password">
    <button class="btn" id="loginBtn">登入</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- ============ CHAT ============ -->
<div id="chat">
  <header>
    <div class="who"><span id="headerLogo" style="display:inline-flex;vertical-align:middle;margin-right:6px"></span><span id="headerTitle">💞 Our Space</span></div>
    <div class="acts">
      <button class="act call" id="callBtn">📞 通話</button>
      <button class="act" id="settingsBtn">⚙</button>
      <button class="act" id="logoutBtn">離開</button>
    </div>
  </header>
  <div class="messages" id="messages"></div>
  <div class="sticker-pad" id="stickerPad">
    <div class="st" data-s="❤️">❤️</div><div class="st" data-s="😘">😘</div><div class="st" data-s="🥰">🥰</div>
    <div class="st" data-s="😭">😭</div><div class="st" data-s="😂">😂</div><div class="st" data-s="🌹">🌹</div>
    <div class="st" data-s="🔥">🔥</div><div class="st" data-s="👑">👑</div><div class="st" data-s="🌙">🌙</div><div class="st" data-s="☀️">☀️</div>
    <div class="addst" id="addStickerBtn" title="上傳自訂貼圖">＋</div>
    <input type="file" id="stickerFile" accept="image/*" hidden>
    <div id="customStickers" style="display:flex;gap:8px;flex-wrap:wrap;width:100%"></div>
  </div>
  <div class="composer">
    <button class="sticker" id="stickerBtn" title="貼圖">😀</button>
    <input type="text" id="txt" placeholder="輸入訊息…" maxlength="500">
    <label class="send" id="imgLabel" title="拍照"><input type="file" id="imgFile" accept="image/*" capture="environment" hidden></label>
    <button class="send" id="sendBtn">➤</button>
  </div>
</div>

<!-- ============ SETTINGS (modal) ============ -->
<div id="settings">
  <div class="card">
    <h1 style="font-size:18px;display:flex;justify-content:space-between;align-items:center">⚙ 設定 <button class="act" id="backBtn" style="padding:4px 12px;font-size:16px">✕</button></h1>
    <div class="row" style="margin-top:18px">
      <label>目前帳號</label><span id="sEmail" style="font-size:13px"></span>
    </div>
    <label style="font-size:12px;color:var(--sub)">我的暱稱(對方會看到)</label>
    <div class="row">
      <input type="text" id="nickInput" placeholder="輸入暱稱">
      <button class="act" id="saveNickBtn">儲存</button>
    </div>
    <label style="font-size:12px;color:var(--sub)">聊天室名稱(雙方同步)</label>
    <div class="row">
      <input type="text" id="roomTitleInput" placeholder="例如:Our Space">
      <button class="act" id="saveTitleBtn">儲存</button>
    </div>
    <label style="font-size:12px;color:var(--sub)">聊天背景</label>
    <div id="bgPicker" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <div data-bg="#8fce8f" style="width:44px;height:44px;border-radius:10px;background:#8fce8f;cursor:pointer;border:2px solid #06c755"></div>
      <div data-bg="#ffe0ec" style="width:44px;height:44px;border-radius:10px;background:#ffe0ec;cursor:pointer"></div>
      <div data-bg="#d6ecff" style="width:44px;height:44px;border-radius:10px;background:#d6ecff;cursor:pointer"></div>
      <div data-bg="#fff6d6" style="width:44px;height:44px;border-radius:10px;background:#fff6d6;cursor:pointer"></div>
      <div data-bg="#2b2b3d" style="width:44px;height:44px;border-radius:10px;background:#2b2b3d;cursor:pointer"></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="act" id="bgImgBtn">🖼 上傳背景圖</button>
      <button class="act" id="resetBgBtn">↺ 還原背景</button>
    </div>
    <input type="file" id="bgImgFile" accept="image/*" hidden>
    <div class="row">
      <label>APP圖示 / LOGO(兩邊同步)</label>
      <button class="act" id="logoBtn">📷 更換</button>
    </div>
    <input type="file" id="logoFile" accept="image/*" hidden>
    <div class="row">
      <label>我的大頭貼(聊天顯示)</label>
      <button class="act" id="avatarBtn">📷 上傳</button>
    </div>
    <input type="file" id="avatarFile" accept="image/*" hidden>
    <label style="font-size:12px;color:var(--sub)">變更密碼</label>
    <input type="password" id="oldPass" placeholder="舊密碼">
    <input type="password" id="newPass" placeholder="新密碼(至少 8 碼)">
    <button class="btn" id="changePassBtn">變更密碼</button>
    <div class="msg" id="passMsg"></div>
  </div>
</div>

<!-- ============ CALL ============ -->
<div id="call">
  <div class="peer" id="peerVideo"><div class="initials" id="peerInitials">💞</div></div>
  <div id="localPreview"></div>
  <div class="cname">kiki</div>
  <div class="cstatus" id="callStatus">連線中…</div>
  <div class="spin" id="callSpin"></div>
  <div class="callbtns">
    <button class="cb min" id="minBtn" title="縮小">🗗</button>
    <button class="cb vid" id="vidBtn" title="視訊">📹</button>
    <button class="cb mic" id="micBtn" title="麥克風">🎙</button>
    <button class="cb end" id="endCallBtn" title="掛斷">✕</button>
  </div>
</div>

<div id="callPill">📞 通話中 · 點擊返回</div>

<div id="incomingCall">
  <div class="inc-box">
    <div class="inc-av">📞</div>
    <div class="inc-title" id="incTitle">來電…</div>
    <div class="inc-sub" id="incSub">有人打給你</div>
    <div class="callbtns">
      <button class="cb ok" id="acceptBtn">✅ 接聽</button>
      <button class="cb end" id="rejectBtn">✕ 拒絕</button>
    </div>
  </div>
</div>

</div>

<script type="module">
/* ================= 設定區(把 key 填這裡)================= */
const SUPABASE_URL  = "https://xwhbhdfjsyybeoqondpr.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aGJoZGZqc3l5YmVvcW9uZHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDcxMTcsImV4cCI6MjEwODU4MzExN30.JMlek3GS22Ci7sI395eVLxO9dkfbD4wYcitQC6iMTss";
const LIVEKIT_URL   = "wss://mess-h6ykmswj.livekit.cloud";
const LIVEKIT_KEY   = "APIyJBKtmh668T4";
const LIVEKIT_ROOM  = "couple-chat";                        // 房間名(兩端要一樣)
/* ============================================================ */

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { Room as LiveKitRoom, RoomEvent, Track } from "https://esm.sh/livekit-client@2";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);
let me = null, livekitRoom = null, sub = null, muted = false, camOn = false, micOn = true;

/* ---------- 工具 ---------- */
const ts = d => new Date(d).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
function userColor(name){ // 簡單配色
  const c=['#ff5c8a','#7c5cff','#3ecf8e','#ffa53e','#5cc8ff'];
  let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))|0;
  return c[Math.abs(h)%c.length];
}


/* ---------- PWA service worker ---------- */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=4").catch(()=>{})); }

/* ---------- 啟動:若已有工作階段則自動進聊天室 ---------- */
(async ()=>{
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    me = session.user;
    const em = session.user.email || '';
    $('email').value = em;
    await enterChat();
  }
})();

/* ---------- 登入 ---------- */
$("loginBtn").onclick = async ()=>{
  let email=$("email").value.trim(), pass=$("password").value;
  if(!email||!pass)return;
  if(email && !email.includes("@")){
    const map={"chiag455371":"chiag455371@gmail.com","boa750124":"boa750124@gmail.com"};
    if(map[email]) email=map[email];
  }
  $("loginMsg").textContent="登入中…";$("loginMsg").className="msg";
  const {data,error}=await sb.auth.signInWithPassword({email, password:pass});
  if(error){$("loginMsg").textContent="登入失敗:"+error.message;$("loginMsg").className="msg err";return;}
  me=data.user;
  enterChat();
};
$("password").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};
// 输入账号后自动补全常见邮箱后缀(方便情侣输入纯账号名)
$("email").addEventListener("blur",()=>{
  let v=$("email").value.trim();
  if(v && !v.includes("@")){
    const map={"chiag455371":"chiag455371@gmail.com","boa750124":"boa750124@gmail.com"};
    if(map[v]) $("email").value=map[v];
  }
});

async function enterChat(){
  $("login").classList.remove("active");
  $("chat").classList.add("active");
  const email = $("email").value.trim() || (me && me.email) || "";
  me = email;                       // 比對用的帳號字串
  $("sEmail").textContent=email;
  await loadProfiles();
  await loadHistory();
  subscribe();
  loadCustomStickers();
  subscribeProfiles();
  subscribeStickers();
  askNotify();
}

/* ---------- 歷史訊息 ---------- */
async function loadHistory(){
  const box=$("messages");box.innerHTML="";
  const {data,error}=await sb.from("messages").select("*").order("created_at",{ascending:true}).limit(200);
  if(error){console.error(error);return;}
  data.forEach(m=>{ if(m.message_type!=="call_signal") renderMsg(m,box,false); });
  box.scrollTop=box.scrollHeight;
}
const seenIds=new Set();
function renderMsg(m,box,scroll=true){
  if(m.id){ if(seenIds.has(m.id)) return; seenIds.add(m.id); }
  const d=document.createElement("div");
  const isMe=(m.username===me);
  d.className="m"+(isMe?" me":"");
  const p=profilesCache[m.username]||{};
  const displayName=p.nickname||m.username;
  const av=document.createElement("div");av.className="av";
  if(p.avatar_url){ av.innerHTML=`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; }
  else av.textContent=(m.username?.[0]?.toUpperCase())||"?";
  const col=document.createElement("div");col.className="col";
  const meta=document.createElement("div");meta.className="meta";
  meta.textContent=displayName+(isMe?" (你)":"");
  const bub=document.createElement("div");bub.className="bub";
  if(m.message_type==="sticker"&&m.image_url){
    // 通訊軟體貼圖格式:大圖、無氣泡底色
    bub.classList.add("stickerimg");
    const img=document.createElement("img");img.src=m.image_url;img.alt="貼圖";bub.appendChild(img);
  }else if(m.message_type==="image"&&m.image_url){
    const img=document.createElement("img");img.src=m.image_url;img.alt="圖片";bub.appendChild(img);
  }else{
    bub.textContent=m.content||"";
  }
  const t=document.createElement("div");t.className="time";t.textContent=ts(m.created_at);
  col.append(meta,bub,t);d.append(av,col);box.appendChild(d);
  if(scroll)box.scrollTop=box.scrollHeight;
}

/* ---------- 提示音 + 通知 ---------- */
let ringEl=null;

function playNotify(){
  try{
    const a=getRing(); a.currentTime=0;
    a.play().catch(()=>{});
  }catch(e){}
}
function notify(title, body){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  try{
    const n=new Notification(title, {body, icon:"./icon-192.png", tag:"couple-"+Date.now()});
    n.onclick=()=>{ window.focus(); n.close(); };
  }catch(e){
    // 部分安卓瀏覽器必須經由 service worker 顯示
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,icon:"./icon-192.png",tag:"couple"})).catch(()=>{});
    }
  }
}
function askNotify(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ if(p!=="granted") showNotifyHint(); });
  } else if(Notification.permission==="denied"){
    showNotifyHint();
  }
}
function showNotifyHint(){
  if($("notifyHint")) return;
  const d=document.createElement("div"); d.id="notifyHint";
  d.style.cssText="position:fixed;left:10px;right:10px;bottom:10px;background:#ff6b6b;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;z-index:9999;display:flex;justify-content:space-between;align-items:center;gap:8px";
  d.innerHTML='<span>通知權限未開，來訊不會跳通知。請到瀏覽器設定→網站權限→通知改為允許。</span><button style="background:#fff;color:#e74c3c;border:none;border-radius:6px;padding:4px 10px;cursor:pointer">知道了</button>';
  d.querySelector("button").onclick=()=>d.remove();
  document.body.appendChild(d);
}

/* ---------- 即時訂閱 ---------- */
function subscribe(){
  if(sub) sub.unsubscribe();
  sub = sb.channel('couple-chat')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'},
      (payload)=>{
        const m = payload.new;
        if(m.message_type === 'call_signal'){
          if(m.content === 'ring'){ showIncoming(m.username); playNotify(); }
          else if(m.content === 'hangup' || m.content === 'reject'){
            $('incomingCall').classList.remove('active');
            livekitRoom?.disconnect(); livekitRoom=null;
            $('call').classList.remove('active');
            $('callPill').classList.remove('active');
            $('localPreview').innerHTML=''; $('localPreview').classList.remove('on');
            $('peerVideo').innerHTML='<div class="initials">💞</div>';
          }
          return;
        }
        renderMsg(m, $('messages'));
        playNotify();
        if(document.hidden || !window.hasFocus()){
          const who=(profilesCache[m.username]?.nickname)||m.username;
          const what = m.message_type==="image"||m.message_type==="sticker" ? "📎 傳了圖片" : (m.content||"");
          notify(who, what);
        }
      })
    .subscribe((status)=>{ console.log('[realtime]', status); });
}

/* ---------- 發訊息 ---------- */
async function sendText(){
  const c=$("txt").value.trim();if(!c)return;
  $("txt").value="";
  const {data:rows,error}=await sb.from("messages").insert({username:me,content:c,message_type:"text"}).select("*");
  if(error){alert("發送失敗:"+error.message);return;}
  if(rows&&rows[0]) renderMsg(rows[0], $("messages"));
}
$("sendBtn").onclick=sendText;
$("txt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey)sendText()};

/* ---------- 自訂貼圖 (跨裝置同步) ---------- */
let stickersCache=[];
async function loadCustomStickers(){
  const {data,error}=await sb.from("stickers").select("*").order("created_at",{ascending:true});
  if(error){console.warn("sticker load",error);return;}
  stickersCache=data||[];
  const box=$("customStickers"); box.innerHTML="";
  stickersCache.forEach(row=>{
    const url=row.url;
    const wrap=document.createElement("div"); wrap.className="stwrap";
    const im=document.createElement("img"); im.src=url; im.title="點擊發送";
    im.onclick=async ()=>{
      const {data:rows}=await sb.from("messages").insert({username:me,content:"",message_type:"sticker",image_url:url}).select("*");
      if(rows&&rows[0]) renderMsg(rows[0], $("messages"));
      $("stickerPad").classList.remove("open");
    };
    const del=document.createElement("button"); del.className="del"; del.textContent="✕"; del.title="刪除此貼圖";
    del.onclick=async (e)=>{
      e.stopPropagation();
      if(!confirm("刪除這個貼圖？"))return;
      await sb.from("stickers").delete().eq("id",row.id);
      loadCustomStickers();
    };
    wrap.appendChild(im); wrap.appendChild(del);
    box.appendChild(wrap);
  });
}
$("addStickerBtn").onclick=()=>$("stickerFile").click();
$("stickerFile").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  const ext=(file.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`stickers/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error:ue}=await sb.storage.from("stickers").upload(path,file);
  if(ue){alert("上傳失敗:"+ue.message);return;}
  const {data:{publicUrl}}=sb.storage.from("stickers").getPublicUrl(path);
  await sb.from("stickers").insert({url:publicUrl, created_by:me});
  loadCustomStickers();
  e.target.value="";
};

/* ---------- 同步設定 (profiles) ---------- */
let profilesCache={};
async function uploadImg(file){
  const ext=(file.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`stickers/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error:ue}=await sb.storage.from("stickers").upload(path,file);
  if(ue) throw ue;
  return sb.storage.from("stickers").getPublicUrl(path).data.publicUrl;
}
async function saveProfile(patch){
  await sb.from("profiles").upsert({username:me, ...patch, updated_at:new Date().toISOString()});
}
function applyRoomSettings(){
  const rows=Object.values(profilesCache);
  if(!rows.length) return;
  // 每個房間層級欄位,取「有設定值」的最新一列(不被對方空值蓋掉)
  rows.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
  const pick = f => { for(const r of rows){ if(r[f]) return r[f]; } return null; };
  const title=pick("room_title"); if(title) $("headerTitle").textContent="💞 "+title;
  const logo=pick("logo_url");
  const hl=$("headerLogo");
  if(hl) hl.innerHTML = logo ? `<img src="${logo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle">` : "";
  const lgn=document.querySelector("#login .logo");
  if(lgn) lgn.innerHTML = logo ? `<img src="${logo}" style="width:72px;height:72px;border-radius:50%;object-fit:cover">` : "💞";
  const bg=pick("background_url");
  if(bg) document.querySelector(".messages").style.background=`url("${bg}") center/cover no-repeat`;
}
async function loadProfiles(){
  const {data}=await sb.from("profiles").select("*");
  profilesCache={};
  (data||[]).forEach(r=>profilesCache[r.username]=r);
  applyRoomSettings();
}
let profSub=null;
function subscribeProfiles(){
  if(profSub) profSub.unsubscribe();
  profSub=sb.channel("profiles-"+me).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},async ()=>{
    await loadProfiles();
    // 重繪既有訊息以更新暱稱/頭像
    const {data}=await sb.from("messages").select("*").order("created_at",{ascending:true});
    $("messages").innerHTML="";
    (data||[]).forEach(m=>renderMsg(m,$("messages"),false));
    $("messages").scrollTop=$("messages").scrollHeight;
  }).subscribe();
}
let stickerSub=null;
function subscribeStickers(){
  if(stickerSub) stickerSub.unsubscribe();
  stickerSub=sb.channel("stickers-"+me).on("postgres_changes",{event:"*",schema:"public",table:"stickers"},()=>{
    loadCustomStickers();
  }).subscribe();
}

  try{
    (participant?.trackPublications ?? new Map()).forEach(pub=>{
      if(pub?.subscribed && pub.track) attachTrack(pub.track);
    });
  }catch(e){console.warn("attachParticipant",e);}
}
async function connectCall(){
  $("call").classList.add("active");
  $("callStatus").textContent="簽發通話憑證中…";$("callSpin").style.display="";
  const {data,error}=await sb.functions.invoke("livekit-token",{});
  if(error||!data)throw new Error("livekit-token Edge Function 未部署: "+(error?.message||""));
  const {token,url}=data;
  livekitRoom=new LiveKitRoom();
  window.__lk = livekitRoom;
  livekitRoom.on(RoomEvent.ParticipantConnected,p=>{
    $("callStatus").textContent="通話中";
    attachParticipant(p);
  });
  livekitRoom.on(RoomEvent.TrackSubscribed,(track,_p)=>attachTrack(track));
  livekitRoom.on(RoomEvent.TrackUnsubscribed,(track,_p)=>{
    if(track.kind===Track.Kind.Video){ $("peerVideo").innerHTML='<div class="initials">💞</div>'; }
  });
  livekitRoom.on(RoomEvent.ParticipantDisconnected,()=>{
    $("peerVideo").innerHTML='<div class="initials">💔</div>';
    $("callStatus").textContent="對方已離開";
  });
  livekitRoom.on(RoomEvent.Disconnected,()=>{
    $("callStatus").textContent="已掛斷";
    setTimeout(()=>$("call").classList.remove("active"),1500);
  });
  await livekitRoom.connect(url||LIVEKIT_URL,token,{audio:true,video:false});
  // 掛上已在房間內的對方
  try{ (livekitRoom.participants ?? new Map()).forEach(attachParticipant); }catch(e){console.warn("enum",e);}
  // 預設只開麥克風,鏡頭由使用者按鈕開啟
  try{ await livekitRoom.localParticipant?.setMicrophoneEnabled(true); }catch(e){console.warn("麥克風",e);}
  camOn = false; micOn = true;
  $("vidBtn").classList.add("off"); $("vidBtn").textContent="📹";
  $("micBtn").classList.remove("off"); $("micBtn").textContent="🎙";
  $("callSpin").style.display="none";
  $("callStatus").textContent="通話中";
}
// 主叫:發打鈴信號再進房間
$("callBtn").onclick=async ()=>{
  try{
    await sb.from("messages").insert({username:me,content:"ring",message_type:"call_signal"});
    await connectCall();
  }catch(e){
    $("callStatus").textContent="❌ "+e.message;
    setTimeout(()=>$("call").classList.remove("active"),3000);
  }
};
// 來電彈窗
function showIncoming(from){
  $("incTitle").textContent="來電…";
  $("incSub").textContent=(from||"對方")+" 打給你";
  $("incomingCall").classList.add("active");
}
$("acceptBtn").onclick=async ()=>{
  $("incomingCall").classList.remove("active");
  try{ await connectCall(); }catch(e){ alert(e.message); }
};
$("rejectBtn").onclick=async ()=>{
  $("incomingCall").classList.remove("active");
  await sb.from("messages").insert({username:me,content:"reject",message_type:"call_signal"});
};
function attachTrack(track,publisher){
  const pv=$("peerVideo");
  if(track.kind===Track.Kind.Video){
    pv.innerHTML="";const v=track.attach();v.id="rv";pv.appendChild(v);
  }else if(track.kind===Track.Kind.Audio){
    const a=track.attach();a.autoplay=true;
  }
}
// 靜音切換
$("micBtn").onclick=async ()=>{
  if(!livekitRoom)return;
  micOn=!micOn;
  try{ await livekitRoom.localParticipant?.setMicrophoneEnabled(micOn); }catch(e){}
  $("micBtn").classList.toggle("off",!micOn);
  $("micBtn").textContent = micOn ? "🎙" : "🔇";
};
// 視訊開關(含自己的子母畫面預覽)
$("vidBtn").onclick=async ()=>{
  if(!livekitRoom)return;
  camOn=!camOn;
  try{ await livekitRoom.localParticipant?.setCameraEnabled(camOn); }catch(e){}
  $("vidBtn").classList.toggle("off",!camOn);
  $("vidBtn").textContent = camOn ? "📹" : "🚫";
  // 本地預覽
  const lp=$("localPreview");
  if(camOn){
    const pub=[...livekitRoom.localParticipant.trackPublications.values()].find(t=>t.kind===Track.Kind.Video);
    if(pub&&pub.track){ lp.innerHTML=""; const v=pub.track.attach(); v.muted=true; lp.appendChild(v); lp.classList.add("on"); }
  } else {
    lp.innerHTML=""; lp.classList.remove("on");
  }
};
// 縮小通話、回到聊天室
$("minBtn").onclick=()=>{
  $("call").classList.remove("active");
  $("callPill").classList.add("active");
};
$("callPill").onclick=()=>{
  $("callPill").classList.remove("active");
  $("call").classList.add("active");
};
$("endCallBtn").onclick=async ()=>{
  try{ await sb.from("messages").insert({username:me,content:"hangup",message_type:"call_signal"}); }catch(_){}
  livekitRoom?.disconnect();livekitRoom=null;
  $("call").classList.remove("active");
  $("callPill").classList.remove("active");
  $("incomingCall").classList.remove("active");
  $("peerVideo").innerHTML='<div class="initials">💞</div>';
  $("localPreview").innerHTML=""; $("localPreview").classList.remove("on");
};

/* ---------- 改密碼 ---------- */
$("changePassBtn").onclick=async ()=>{
  const old=$("oldPass").value,nw=$("newPass").value;
  if(nw.length<8){$("passMsg").textContent="新密碼至少 8 碼";$("passMsg").className="msg err";return;}
  const {error}=await sb.auth.updateUser({password:nw});
  if(error){$("passMsg").textContent="變更失敗:"+error.message;$("passMsg").className="msg err";return;}
  $("passMsg").textContent="✅ 密碼已變更,下次請用新密碼";$("passMsg").className="msg ok";
  $("oldPass").value="";$("newPass").value="";
};

/* ---------- 畫面切換 ---------- */
$("backBtn").onclick=()=>$("settings").classList.remove("active");
$("logoutBtn").onclick=async ()=>{
  try{ sub?.close(); profSub?.close(); livekitRoom?.disconnect(); }catch(e){}
  try{ await sb.auth.signOut(); }catch(e){}
  localStorage.removeItem("sb-xwhbhdfjsyybeoqondpr-auth-token");
  location.href = "./?v=out";
};

/* 監聽 session:只有被登出(SIGNED_OUT)時才重整,避免初始無 session 時無限 reload */
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT" && !session)location.reload()});
</script>
